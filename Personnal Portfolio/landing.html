<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Welcome landing page for Life and Tech by Pierce John Vargas."
  />
  <title>Life and Tech | Welcome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body class="landing-body">
  <div class="landing-grid" aria-hidden="true"></div>
  <div class="landing-glow landing-glow-a" aria-hidden="true"></div>
  <div class="landing-glow landing-glow-b" aria-hidden="true"></div>
  <div class="landing-glow landing-glow-c" aria-hidden="true"></div>

  <main class="landing-main">
    <div class="landing-stage">
      <div class="landing-crest reveal is-visible" aria-hidden="true">PJ</div>
      <span class="landing-chip reveal is-visible">Life and Tech</span>
      <p class="landing-name reveal is-visible">Pierce John Vargas</p>

      <h1 class="landing-title reveal is-visible">
        A quiet digital space for
        <span class="landing-type-line">
          <span id="typedText" class="typed-text"></span>
          <span class="typed-caret" aria-hidden="true"></span>
        </span>
      </h1>

      <p class="landing-subtitle reveal is-visible">
        Design, photography, and digital identity presented with restraint,
        atmosphere, and a more refined visual rhythm.
      </p>

      <div class="landing-actions reveal is-visible">
        <a href="portfolio.html" class="btn btn-primary landing-cta">Enter Portfolio</a>
      </div>

      <div class="landing-signature reveal is-visible">
        <span>Minimal</span>
        <span>Refined</span>
        <span>Intentional</span>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="landing.js"></script>
</body>
</html>
